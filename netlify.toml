[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: client-side routes (e.g. /habitat) resolve to the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
